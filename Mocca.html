        <meta charset="UTF-8">

    <body class="Mocca-body">
        
    <a id="arrow" class="arrow" ></a>
    

    <div class="photo-buying-container">
           <div class="Mocca-photo"></div>

                        <p class="Mocca-text">Mocca coffe:$20</p>


                      <div class="sizes">
                                <p class="size-text" >Size:</p>
                             <div class="sizes-categories">
                                 <button id="small" >S</button>
                                 <button id="midium" >M</button>
                                  <button id="large" >L</button>
                                   <button id="xl" >XL</button>
                                  <button id="xxl" >XXL</button>
                             </div>
                       
                        </div>

    </div>
                <div class="Extra">
                      <div class="shugar-container">
                                            <p class="placeholder-shugar" >Shugar Shots</p>
                             <button class="minus" id="minus">-</button>
                            <input type="number" class="shugar" id="shugar" value="0" readonly required  >
                            <button class="pluss" id="pluss" >+</button>
                           
                      </div>
                    <div class="tempreture">
                                             <p>Tempreture</p>
                         <details>
                            <summary id="summary" >☰ Choose the tempreture </summary>
                            <ul>
                            <li class="li-temp" id="li-temp" >Hott</li>
                            <li class="li-temp" id="li-temp" >Warm</li>
                            <li class="li-temp" id="li-temp" >Iced</li>
                         </ul>
                         </details>
                         
                    </div>
                    <div class="Milk">
                         <p>Milk Type</p>
                           <details>
                            <summary id="milk-sum">☰ Choose milk</summary>
                            <ul class="ul" id="ul">
                           <li class="li" id="milk1" >No Milk</li>
                            <li class="li" id="milk2" >Regular Milk</li>
                            <li class="li" id="milk3">Oat Milk</li>
                             <li class="li" id="milk4">Almond Milk</li>
                         </ul>
                         </details>
                         
                    </div>



                </div>


        <div class="how-many">
             <p>How many cups :</p>
                <button  id="minus2">-</button>
                 <input type="number" class="shugar" id="Quantity" value="0" readonly required  >
                  <button  id="pluss2" >+</button>

        </div>


              <div class="Tottal-price" id="total" >
                   <b>Tottal price : </b>
 <div class="p-total" id="ptotal" readonly ></div>
                                              <p class="Dollar-Signe">$</p>
               </div>
                     
<div id="SlidingRoad" class="Order-Button-Container">
    <button id="SlideButton" class="Orderingbtn" type="button" draggable="true">
     <div class="OrderSticker" ></div>
    </button>
        <div id="SlideEnd" class="SlideEnd"></div>
    </div>
